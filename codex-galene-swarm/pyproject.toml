[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-galene-swarm"
version = "0.2.0rc1"
description = "Codex-controlled Galene/Qwen worker swarm exposed through MCP"
requires-python = ">=3.11"
dependencies = [
  "docker>=7.1,<8",
  "mcp>=2.0,<3",
]

[project.scripts]
codex-galene-swarm = "codex_galene_swarm.server:main"

[tool.setuptools.packages.find]
where = ["src"]
