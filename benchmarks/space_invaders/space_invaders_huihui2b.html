<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Space Invaders (Huihui-Qwen3.5-2B-Abliterated Swarm)</title>
  <style>
    body {
      background: #050811;
      color: #fff;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    h1 { color: #22c55e; margin-bottom: 6px; letter-spacing: 2px; text-shadow: 0 0 10px rgba(34,197,94,0.5); }
    .sub { color: #94a3b8; font-size: 0.85rem; margin-bottom: 12px; }
    canvas {
      background: #090d16;
      border: 2px solid #22c55e;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(34, 197, 94, 0.25);
    }
    .footer { margin-top: 10px; font-size: 0.85rem; color: #94a3b8; }
  </style>
</head>
<body>
  <h1>👾 SPACE INVADERS</h1>
  <div class="sub">Generated by Huihui-Qwen3.5-2B-Abliterated Swarm &bull; Orchestrated by TypeSafe Jev</div>
  <canvas id="c" width="400" height="500"></canvas>
  <div class="footer">&larr; &rarr; / A D to Move &bull; SPACE to Shoot</div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let invaders = [];
    let bullets = [];
    let invaderDir = 1;
    let score = 0;
    let gameOver = false;
    let win = false;

    // Component 1: Player Cannon
    let player = {
      x: 180,
      y: 450,
      width: 36,
      height: 16,
      speed: 4,
      dx: 0,
      update: function(canvasWidth) {
        this.x = Math.max(0, Math.min(canvasWidth - this.width, this.x + this.dx));
      }
    };

    // Component 2: Invader Fleet
    function createInvaders() {
    invaders = [];
    for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 6; c++) {
            invaders.push({
                x: 40 + c * 50,
                y: 50 + r * 35,
                w: 28,
                h: 18,
                alive: true,
                dir: invaderDir
            });
        }
    }
}

function updateInvaders(canvasWidth) {
    let edge = false;
    invaders.forEach(i => {
        if (i.alive) {
            i.x += invaderDir * 1.5;
            if (i.x <= 10 || i.x >= canvasWidth - 38) {
                edge = true;
            }
        }
    });

    if (edge) {
        invaderDir *= -1;
        invaders.forEach(i => {
            i.y += 15;
        });
    }
}

    // Component 3: Bullets & Ballistics
    function fireLaser() {
        bullets.push({
            x: player.x + player.width / 2 - 2,
            y: player.y,
            w: 4,
            h: 10,
            vy: -6
        });
    }

function updateBulletsAndCollisions() {
    bullets.forEach(b => {
        b.y += b.vy;
    });
    bullets = bullets.filter(b => b.y > 0);

    bullets.forEach(b => {
        invaders.forEach(inv => {
            if (inv.alive && b.x > inv.x && b.x < inv.x + inv.w && b.y > inv.y && b.y < inv.y + inv.h) {
                inv.alive = false;
                b.y = -10;
                score += 100;
            }
        });
    });
}

    // Component 4: Renderers
    function drawRetroInvader(ctx, x, y, w, h) {
    ctx.fillStyle = '#22c55e';
    ctx.fillRect(x + 4, y, w - 8, h);
    ctx.fillRect(x, y + 4, w, h - 8);
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(x + 6, y + 6, 4, 4);
    ctx.fillRect(x + w - 10, y + 6, 4, 4);
}

function drawPlayerShip(ctx, x, y, w, h) {
    ctx.fillStyle = '#38bdf8';
    ctx.fillRect(x, y + 8, w, h - 8);
    ctx.fillRect(x + w/2 - 4, y, 8, 8);
}

    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.code === 'Space' && !gameOver && !win) {
        e.preventDefault();
        fireLaser();
      }
    });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    createInvaders();

    function loop() {
      // Input
      player.dx = 0;
      if (keys['ArrowLeft'] || keys['KeyA']) player.dx = -player.speed;
      if (keys['ArrowRight'] || keys['KeyD']) player.dx = player.speed;

      if (!gameOver && !win) {
        player.update(canvas.width);
        updateInvaders(canvas.width);
        updateBulletsAndCollisions();

        const living = invaders.filter(i => i.alive);
        if (living.length === 0) win = true;
        if (living.some(i => i.y + i.h >= player.y)) gameOver = true;
      }

      // Render
      ctx.fillStyle = '#090d16';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawPlayerShip(ctx, player.x, player.y, player.width, player.height);

      invaders.forEach(inv => {
        if (inv.alive) drawRetroInvader(ctx, inv.x, inv.y, inv.w, inv.h);
      });

      ctx.fillStyle = '#facc15';
      bullets.forEach(b => {
        ctx.fillRect(b.x, b.y, b.w, b.h);
      });

      ctx.fillStyle = '#22c55e';
      ctx.font = '14px monospace';
      ctx.fillText('SCORE: ' + score, 15, 25);

      if (win) {
        ctx.fillStyle = '#22c55e';
        ctx.font = '22px monospace';
        ctx.fillText('VICTORY!', 145, 260);
      } else if (gameOver) {
        ctx.fillStyle = '#ef4444';
        ctx.font = '22px monospace';
        ctx.fillText('GAME OVER', 135, 260);
      }

      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
