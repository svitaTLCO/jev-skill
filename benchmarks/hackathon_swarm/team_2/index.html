function updatePaddle(keys) {
  const paddle = document.getElementById('c');
  let paddleX = paddle.offsetLeft;
  
  if (keys['ArrowRight'] || keys['KeyD']) {
    paddleX += 5;
  } else if (keys['ArrowLeft'] || keys['KeyA']) {
    paddleX -= 5;
  }
  
  // Boundary checks for paddle
  if (paddleX < 0) paddleX = 0;
  if (paddleX + paddle.width > canvas.width) paddleX = canvas.width - paddle.width;

function draw() {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  
  // Clear canvas with dark background
  ctx.fillStyle = '#070b14';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  // Draw glowing neon elements
  drawNeonPaddle(ctx);
  drawBall(ctx);
  drawBrickGrid(ctx);
}

function drawHUD() {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  
  // Create retro monospace font style
  ctx.font = '16px "Courier New", Courier, monospace';
  
  // Draw HUD elements
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center';
  
  // Score display
  ctx.fillText('Score: 0', canvas.width / 2, 40);
  
  // Lives display
  ctx.fillText(`Lives: ${player.lives}`, canvas.width / 2, 60);
}

// Helper functions for neon effects
function drawNeonPaddle(ctx) {
  const paddle = document.getElementById('paddle');
  if (!paddle) return;
  
  // Neon glow effect
  ctx.shadowBlur = 15;
  ctx.shadowColor = '#0ff';
  
  // Paddle drawing with neon border
  ctx.fillStyle = '#fff';
  ctx.fillRect(20, 30, 40, 8);
}

const keys = {};
window.addEventListener('keydown', e => { keys[e.key] = true; keys[e.code] = true; });
window.addEventListener('keyup', e => { keys[e.key] = false; keys[e.code] = false; });

function loop() {
  if (!gameOver && !gameWon) {
    if (typeof updatePaddle === 'function') updatePaddle(keys);
    if (typeof updateBall === 'function') updateBall();
    if (typeof checkBrickCollisions === 'function') checkBrickCollisions();
  }
  if (typeof draw === 'function') draw();
  if (typeof drawHUD === 'function') drawHUD();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

</html>
