function updatePlayer(keys) {
  const keyA = keys['KeyA'] || keys['ArrowLeft'];
  const keyD = keys['KeyD'] || keys['ArrowRight'];
  
  if (keyA && !keyD) {
    player.x -= player.speed;
  } else if (keyD && !keyA) {
    player.x += player.speed;
  }

  // Clamp to canvas width
  const maxWidth = canvas.width - 20;
  if (player.x < 0) player.x = 0;
  if (player.x > maxWidth) player.x = maxWidth;
}

    const rows = 3;

        invaders.push({
            x: Math.random() * 40 + 10,
            y: Math.random() * 20 + 30,
            width: 28,
            height: 18,
            alive: true,
            points: 10
        });
    }
}

function updateInvaders() {
    // Move all invaders horizontally by invaderDir * invaderSpeed
    for (let i = 0; i < invaders.length; i++) {
        const invader = invaders[i];
        
        if (invader.alive) {
            invader.x += invaderDir * invaderSpeed;
            
            // Check if reached left edge (< 10) or right edge (> 360)
            if (invader.x < 10 || invader.x > 360) {
                invaderDir *= -1;
                
                // Drop invaders down by 14px when direction reverses
                for (let j = i + 1; j < invaders.length && invaders[j].alive; j++) {

        }
    }

function updateBullets() {
    for (let i = bullets.length - 1; i >= 0; i--) {
        let bullet = bullets[i];
        
        // Move bullet upward by its speed
        bullet.y -= bullet.speed;
        
        // Remove if off-screen at the bottom
        if (bullet.y < 0) {
            bullets.splice(i, 1);
            continue;
        }
    }

// Keyboard Controls
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  keys[e.code] = true;
  if (e.code === 'Space' && !gameOver && !gameWon) {

  }
});

});

// Main Game Loop
function gameLoop() {

    if (typeof updatePlayer === 'function') updatePlayer(keys);
