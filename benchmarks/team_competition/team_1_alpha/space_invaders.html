const canvas = document.getElementById('c');

let player = { 
    x: 180, 
    y: 450, 
    width: 40, 
    height: 18, 
    speed: 6,
    dx: 0 // Velocity for movement
};

function updatePlayer(keys) {
    const keyLeft = keys['ArrowLeft'] || keys['KeyA'];
    const keyRight = keys['ArrowRight'] || keys['KeyD'];

    if (keyLeft && !player.dx) player.dx = -player.speed;
    else if (!keyLeft && player.dx) player.dx = -player.speed; // Reset velocity when not moving
    
    if (keyRight && !player.dx) player.dx = player.speed;
    else if (!keyRight && player.dx) player.dx = player.speed;

    player.x += player.dx;

    // Clamp player position to canvas width (400px)
    if (player.x < 0) {
        player.x = 0;
    } else if (player.x > canvas.width - player.width) {
        player.x = canvas.width - player.width;
    }
}

// Initialize movement logic on keydown events
document.addEventListener('keydown', (e) => {
    const keys = {};
    // Add all keys to the object for easy access in updatePlayer
    if(e.key === 'ArrowLeft' || e.key === 'a') keys['KeyA'] = true;
    else if(e.key === 'ArrowRight' || e.key === 'd') keys['KeyD'] = true;

    // Only trigger update if at least one key is pressed to avoid lag
    if (keys['KeyA'] || keys['KeyD']) {
        updatePlayer(keys);
    }
});

// Initialize movement logic on keyup events
document.addEventListener('keyup', (e) => {
    const keys = {};
    // Remove all keys from the object when released
    if(e.key === 'ArrowLeft' || e.key === 'a') keys['KeyA'] = false;
    else if(e.key === 'ArrowRight' || e.key === 'd') keys['KeyD'] = false;

    updatePlayer(keys);
});
