// Initialize invaders

// Keyboard Controls
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  keys[e.code] = true;
  if (e.code === 'Space' && !gameOver && !gameWon) {

  }
});
window.addEventListener('keyup', e => {
  keys[e.key] = false;
  keys[e.code] = false;
});

// Main Game Loop

  requestAnimationFrame(gameLoop);
}
