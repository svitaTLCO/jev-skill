function updatePlayer(keys) {
    const keyMap = {
        'ArrowLeft': 'a',
        'KeyA': 'a',
        'ArrowRight': 'd',
        'KeyD': 'd'
    };

    // Handle movement based on keys pressed
    if (keys['a'] || keys['A']) player.dx = -player.speed;
    else if (keys['d'] || keys['D']) player.dx = player.speed;
    else {
        player.dx = 0;
    }

    // Clamp to canvas width (400px)
    const maxWidth = canvas.width;
    
    if (player.x < 0) player.x = 0;
    if (player.x > maxWidth - player.width) player.x = maxWidth - player.width;
}

function initInvaders() {
    const rows = 3;
    const cols = 6;
    const width = 28;
    const height = 18;
    
    // Create grid of invaders
    for (let row = 0; row < rows; row++) {
        let rowInvaders = [];
        for (let col = 0; col < cols; col++) {
            rowInvaders.push({
                x: col * width,
                y: row * height + 28, // Starting position
                width: width,
                height: height,
                alive: true,
                points: 10,
                dir: 1,
                speed: 1.2
            });
        }
        invaders.push(rowInvaders);
    }
}

function updateInvaders() {
    const aliveInvaders = [];
    
    // Move all alive invaders horizontally
    for (let row = 0; row < invaders.length; row++) {
        let rowInvaders = [];
        
        for (let col = 0; col < invaders[row].length; col++) {
            if (invaders[row][col]) {
                const invader = invaders[row][col];
                
                // Move horizontally
                invader.x += invader.dir * invader.speed;
                
                // Check for edge collision and reverse direction
                if (invader.x < 10 || invader.x > 360) {
                    invader.dir *= -1;
                    
                    // Drop invaders down when they hit the edge
                    if (invader.alive && invader.y + invader.height >= 480) {
                        invader.y += 14;
                        rowInvaders.push(invader);
                    } else {
                        rowInvaders.push(invader);
                    }
                } else {
                    rowInvaders.push(invader);
                }
            }
        }
        
        invaders[row] = rowInvaders;
    }
    
    // Check for invader death and respawn
    let deadCount = 0;
    for (let row = 0; row < invaders.length; row++) {
        const rowInvaders = [];
        
        for (let col = 0; col < invaders[row].length; col++) {
            if (!invaders[row][col]) {
                deadCount++;
            } else {
                rowInvaders.push(invaders[row][col]);
            }
        }
        
        // Respawn dead invaders at the bottom
        for (let i = 0; i < deadCount && rowInvaders.length < invaders.length * cols; i++) {
            const invader = invaders[deadCount % invaders.length];
            
            if (!invader.alive) {
                invader.alive = true;
                invader.x = col * width + 10; // Center position
                invader.y = row * height + 28;
                invader.dir = 1;
                invader.speed = 1.2;
            } else {
                rowInvaders.push(invader);
            }
        }
        
        invaders[row] = rowInvaders;
    }
    
    // Check for game over condition (all enemies dead)
    if (deadCount === 0 && aliveInvaders.length === 0) {
        return true;
    }
}

function draw() {

  if (!canvas) return;

  // Clear canvas with retro green background
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#0a3815';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Draw retro green player cannon
  ctx.save();
  ctx.translate(canvas.width / 2 - 40, canvas.height - 60);
  ctx.rotate(-Math.PI / 4);
  
  // Cannon body (green)
  ctx.fillStyle = '#3d8a3d';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(25, 10);
  ctx.lineTo(25, -10);
  ctx.fill();

  // Cannon barrel (green)
  ctx.fillStyle = '#4da84a';
  ctx.fillRect(-5, -3, 10, 6);

  // Retro cannon details
  ctx.strokeStyle = '#2d7b2d';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.restore();

  // Draw invader rectangles (neon colors)
  const invaders = document.querySelectorAll('.invader');
  invaders.forEach((invader, index) => {
    const x = invader.offsetLeft;
    const y = invader.offsetTop;
    
    // Neon cyan/magenta gradient based on position
    const color1 = '#00ffff';
    const color2 = '#ff00ff';
    
    ctx.save();
    ctx.translate(x, y);

      ctx.fillStyle = color1;
      ctx.fillRect(-width / 2, -height / 2, width, height);
      
      // Add glow effect
      ctx.shadowColor = '#ff00ff';
      ctx.shadowBlur = 5;
    }

      const eyeY = y + height / 2 - 8;
