<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flappy Pig - Jev Micro-Orchestrated</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    h1 { color: #ff99c8; font-size: 1.6rem; margin-bottom: 8px; }
    canvas {
      background: #70c5ce;
      border: 3px solid #ff99c8;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      cursor: pointer;
    }
    .hint { margin-top: 10px; font-size: 0.9rem; color: #94a3b8; }
  </style>
</head>
<body>
  <h1>🐷 FLAPPY PIG (JEV MICRO-ORCHESTRATED)</h1>
  <canvas id="c" width="360" height="500"></canvas>
  <div class="hint">Click or Spacebar to Flap wings | Built with Qwen 1.5B via Jev Micro-Steps</div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let score = 0;
    let gameOver = false;

    // --- COMPONENT 1: PIG (Generated by local model) ---
    let pig = {
      x: 60,
      y: 200,
      vy: 0,
      gravity: 0.35,
      jump: -6.0,
      update: function() {
        this.vy += this.gravity;
        this.y += this.vy;
      }
    };

    // --- COMPONENT 2: PIPES (Generated by local model) ---
    let pipes = [{x: 360, top: 120, gap: 110}];

    function updatePipes() {
      pipes.forEach(pipe => {
        pipe.x -= 2.2;
      });
      if (pipes.length > 0 && pipes[0].x < -50) {
        pipes.shift();
      }
      if (pipes.length > 0 && pipes[pipes.length - 1].x < 190) {
        pipes.push({ x: 360, top: Math.random() * 180 + 60, gap: 115 });
      }
    }

    // --- COMPONENT 3: COLLISION (Generated by local model) ---
    function checkCollision() {
      if (pig.y > canvas.height - 20 || pig.y < 0) return true;
      for (let i = 0; i < pipes.length; i++) {
        const p = pipes[i];
        if (p.x < pig.x + 18 && p.x + 48 > pig.x - 18) {
          if (pig.y - 18 < p.top || pig.y + 18 > p.top + p.gap) {
            return true;
          }
        }
      }
      return false;
    }

    // --- INPUT HANDLERS ---
    function flap() {
      if (gameOver) {
        pig.y = 200;
        pig.vy = 0;
        pipes = [{x: 360, top: 120, gap: 110}];
        score = 0;
        gameOver = false;
      } else {
        pig.vy = pig.jump || -6.0;
      }
    }
    window.addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); flap(); } });
    canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); flap(); });

    // --- RENDER & GAME LOOP ---
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw Pipes
      ctx.fillStyle = '#73bf2e';
      ctx.strokeStyle = '#558822';
      ctx.lineWidth = 2;
      pipes.forEach(p => {
        ctx.fillRect(p.x, 0, 48, p.top);
        ctx.strokeRect(p.x, 0, 48, p.top);
        ctx.fillRect(p.x, p.top + p.gap, 48, canvas.height - p.top - p.gap);
        ctx.strokeRect(p.x, p.top + p.gap, 48, canvas.height - p.top - p.gap);
      });

      // Draw Pink Pig
      ctx.save();
      ctx.translate(pig.x, pig.y);
      // Body
      ctx.fillStyle = '#ffb3c6';
      ctx.beginPath();
      ctx.arc(0, 0, 18, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#d94b76';
      ctx.lineWidth = 2;
      ctx.stroke();
      // Snout
      ctx.fillStyle = '#fb6f92';
      ctx.beginPath();
      ctx.ellipse(12, 2, 6, 4, 0, 0, Math.PI * 2);
      ctx.fill();
      // Wing
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(-4, -4, 10, 5, -0.3, 0, Math.PI * 2);
      ctx.fill();
      // Eye
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(6, -6, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Draw Score
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 3;
      ctx.font = 'bold 28px sans-serif';
      ctx.textAlign = 'center';
      ctx.strokeText(score, canvas.width / 2, 45);
      ctx.fillText(score, canvas.width / 2, 45);

      if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff6b6b';
        ctx.font = 'bold 30px sans-serif';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
        ctx.fillStyle = '#fff';
        ctx.font = '18px sans-serif';
        ctx.fillText('Click to Restart', canvas.width / 2, canvas.height / 2 + 25);
      }
    }

    function loop() {
      if (!gameOver) {
        pig.update();
        if (typeof updatePipes === 'function') updatePipes();
        if (typeof checkCollision === 'function' && checkCollision()) {
          gameOver = true;
        }
        // Score trigger
        pipes.forEach(p => {
          if (!p.passed && p.x + 48 < pig.x) {
            p.passed = true;
            score++;
          }
        });
      }
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
