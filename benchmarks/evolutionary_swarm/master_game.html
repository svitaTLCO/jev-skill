<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Space Invaders Deluxe (8-Team Evolutionary Swarm)</title>
  <style>
    body {
      background: #050811;
      color: #00ff88;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    h1 { margin: 0 0 6px; font-size: 1.4rem; letter-spacing: 2px; text-shadow: 0 0 10px #00ff88; }
    .badge { font-size: 0.8rem; color: #00f3ff; margin-bottom: 12px; }
    canvas {
      background: #080c18;
      border: 2px solid #00ff88;
      border-radius: 6px;
      box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
    }
    .footer { margin-top: 10px; font-size: 0.85rem; color: #94a3b8; }
  </style>
</head>
<body>
  <h1>👾 SPACE INVADERS // EVOLUTIONARY MASTER</h1>
  <div class="badge">Synthesized from 8-Team Evolutionary Promotion Tournament &bull; Governed by TypeSafe Jev</div>
  <canvas id="c" width="400" height="500"></canvas>
  <div class="footer">&larr; &rarr; / A D to Move &bull; SPACEBAR to Shoot</div>

  <script>
  

// === PROMOTED FROM TASK 1: PLAYER CANNON & GLOBAL STATE (Team #5) ===
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let player = { x: 180, y: 450, width: 36, height: 16, speed: 6 };
let score = 0;
let lives = 3;
let gameOver = false;
let gameWon = false;

function updatePlayer(keys) {
    const leftKey = keys['ArrowLeft'] || keys['a'];
    const rightKey = keys['ArrowRight'] || keys['d'];

    if (leftKey && player.x > 0) {
        player.x -= player.speed;
    } else if (rightKey && player.x < canvas.width - player.width) {
        player.x += player.speed;
    }
}

// === PROMOTED FROM TASK 2: INVADER FLEET & MARCHING VECTOR LOGIC (Team #7) ===
let invaders = [];
let invaderDir = 1;
let invaderSpeed = 1.2;

function initInvaders() {
    const rows = 3;
    const cols = 6;
    const xOffset = (canvas.width - (cols * 40)) / 2; // Centering logic based on grid size
    
    invaders = [];
    
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            const invader = {
                x: xOffset + c * 40,
                y: 150 + r * 30, // Starting Y position
                width: 28,
                height: 18,
                alive: true,
                points: 10
            };
            invaders.push(invader);
        }
    }
}

function updateInvaders() {
    let hitEdge = false;
    for (let inv of invaders) {
        if (!inv.alive) continue;
        inv.x += invaderDir * invaderSpeed;
        if (inv.x < 10 || inv.x > canvas.width - inv.width - 10) {
            hitEdge = true;
        }
    }
    if (hitEdge) {
        invaderDir *= -1;
        for (let inv of invaders) {
            if (inv.alive) {
                inv.y += 14;
                if (inv.y + inv.height >= player.y) {
                    gameOver = true;
                }
            }
        }
    }
}

// === PROMOTED FROM TASK 3: PROJECTILES, BALLISTICS & COLLISION GRID ===
let bullets = [];

function shootBullet() {
    if (bullets.length < 4) {
        bullets.push({
            x: player.x + player.width / 2 - 2,
            y: player.y - 6,
            width: 4,
            height: 10,
            speed: 8
        });
    }
}

function updateBullets() {
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.y -= b.speed;
        if (b.y < 0) {
            bullets.splice(i, 1);
        }
    }
}

function checkCollisions() {
    let aliveCount = 0;
    for (let inv of invaders) {
        if (!inv.alive) continue;
        aliveCount++;
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            if (
                b.x < inv.x + inv.width &&
                b.x + b.width > inv.x &&
                b.y < inv.y + inv.height &&
                b.y + b.height > inv.y
            ) {
                inv.alive = false;
                bullets.splice(i, 1);
                score += inv.points || 10;
                break;
            }
        }
    }
    if (aliveCount === 0 && invaders.length > 0) {
        gameWon = true;
    }
}

// === PROMOTED FROM TASK 4: RETRO NEON CANVAS RENDERER & GAME LOOP ===
function draw() {
    ctx.fillStyle = '#060913';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw Player
    ctx.fillStyle = '#00ff88';
    ctx.shadowColor = '#00ff88';
    ctx.shadowBlur = 10;
    ctx.fillRect(player.x, player.y, player.width, player.height);

    // Draw Invaders
    for (let inv of invaders) {
        if (!inv.alive) continue;
        ctx.fillStyle = '#00f3ff';
        ctx.shadowColor = '#00f3ff';
        ctx.shadowBlur = 8;
        ctx.fillRect(inv.x, inv.y, inv.width, inv.height);
    }

    // Draw Bullets
    ctx.fillStyle = '#ffea00';
    ctx.shadowColor = '#ffea00';
    ctx.shadowBlur = 6;
    for (let b of bullets) {
        ctx.fillRect(b.x, b.y, b.width, b.height);
    }
    ctx.shadowBlur = 0;
}

function drawHUD() {
    ctx.font = '14px monospace';
    ctx.fillStyle = '#00ff88';
    ctx.fillText(`SCORE: ${score}`, 16, 26);
    ctx.fillText(`LIVES: ${lives}`, canvas.width - 90, 26);

    if (gameOver) {
        ctx.font = '24px monospace';
        ctx.fillStyle = '#ff007f';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
        ctx.font = '12px monospace';
        ctx.fillStyle = '#94a3b8';
        ctx.fillText('Press ESC or refresh to restart', canvas.width / 2, canvas.height / 2 + 30);
        ctx.textAlign = 'left';
    } else if (gameWon) {
        ctx.font = '24px monospace';
        ctx.fillStyle = '#00ff88';
        ctx.textAlign = 'center';
        ctx.fillText('VICTORY!', canvas.width / 2, canvas.height / 2);
        ctx.textAlign = 'left';
    }
}

// Keyboard controls
const keys = {};
window.addEventListener('keydown', e => {
    keys[e.key] = true;
    keys[e.code] = true;
    if (e.code === 'Space' && !gameOver && !gameWon) {
        shootBullet();
    }
});
window.addEventListener('keyup', e => {
    keys[e.key] = false;
    keys[e.code] = false;
});

// Main loop
function gameLoop() {
    if (!gameOver && !gameWon) {
        updatePlayer(keys);
        updateInvaders();
        updateBullets();
        checkCollisions();
    }
    draw();
    drawHUD();
    requestAnimationFrame(gameLoop);
}

// Boot the game
initInvaders();
requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
